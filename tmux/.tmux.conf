set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",tmux-256color:Tc"


set -g mouse on
setw -g mode-keys vi
# 快速重载配置文件 (快捷键: 按下 Ctrl+b 松开，再按 Ctrl+r)
bind C-r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================================
# 状态栏美化配置 (极简黑灰风格，无花哨颜色，无电池电量)
# ==========================================

# 状态栏刷新频率 (秒)
set -g status-interval 1

# 状态栏放底部
set-option -g status-position bottom

# 状态栏整体背景和前景色 (灰色背景)
set -g status-bg colour236
set -g status-fg colour250

# 窗口列表显示位置 (放到左边)
set -g status-justify left

# ========== 左侧状态栏 ==========
# 隐藏左侧的 Session 名称 (例如 [0])
set -g status-left-length 0
set -g status-left ""

# ========== 右侧状态栏 ==========
# 包含内存和日期时间
set -g status-right-length 100
set -g status-right "#[fg=colour245] 💾 Mem: #(memory_pressure | awk '/free percentage:/ {print 100 - $5}')%% │ 📅 %Y-%m-%d %H:%M:%S "

# ========== 窗口样式 ==========
# 未选中窗口的样式 (暗灰色，两边增加空格留白)
setw -g window-status-format "#[fg=colour245,bg=colour236]  #I: #W  "

# 当前选中窗口的样式 (带一个原点图标标示当前窗口，纯白加粗，背景提亮)
setw -g window-status-current-format "#[fg=colour255,bg=colour239,bold]  ● #I: #W  "

# 面板边框颜色 (极简黑灰)
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour250

# ==========================================
# 新增的快捷键配置
# ==========================================

# --- 1. 面板切换 (带前缀键: Ctrl+b + hjkl) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 2. 面板切换 (无前缀极速流: Alt + hjkl) ---
# 直接按住 Alt (macOS 是 Option 键) + hjkl 闪电切换面板
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# --- 3. 调整面板大小 (带前缀键: Ctrl+b + 大写 HJKL) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

run '~/.tmux/plugins/tpm/tpm'

